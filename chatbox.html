<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kuis Karier — LPKS Arima Persada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #050B14;
    --navy-light: #0E1A2B;
    --gold: #D4AF37;
    --gold-hover: #F3E5AB;
    --text-main: #E2E8F0;
    --text-muted: #94A3B8;
    --border: rgba(255,255,255,0.1);
    --font-serif: 'Playfair Display', serif;
    --font-sans: 'Inter', sans-serif;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans); background: var(--navy); color: var(--text-main);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  
  /* Background Pattern Halus */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background-image: radial-gradient(circle at 50% 50%, rgba(212,175,55,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  /* === HEADER & PROGRESS BAR === */
  .header {
    background: rgba(14, 26, 43, 0.9); backdrop-filter: blur(20px);
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; position: relative;
  }
  .header img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border); }
  .header-info h1 { font-family: var(--font-serif); font-size: 1.2rem; color: #fff; font-weight: 600; }
  .header-info p { font-size: 0.75rem; color: #10B981; display: flex; align-items: center; gap: 6px; margin-top: 2px;}
  .header-info p::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #10B981; }

  .progress-container {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.05);
  }
  .progress-bar {
    height: 100%; width: 0%; background: var(--gold); transition: width 0.5s var(--ease);
  }

  /* === CHAT AREA === */
  .chat-container {
    flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
    max-width: 800px; margin: 0 auto; width: 100%; scroll-behavior: smooth;
  }
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

  /* Animasi Masuk Pesan */
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .message { display: flex; max-width: 85%; animation: slideUp 0.4s var(--ease) forwards; }
  .message.bot { align-self: flex-start; }
  .message.user { align-self: flex-end; }
  
  .bot-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--navy-light);
    display: grid; place-items: center; margin-right: 12px; flex-shrink: 0;
    border: 1px solid var(--border); color: var(--gold); font-weight: bold; font-size: 0.8rem;
  }
  
  .bubble {
    padding: 16px 20px; font-size: 0.95rem; line-height: 1.6;
    position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .bot .bubble { 
    background: var(--navy-light); border: 1px solid var(--border); 
    border-radius: 4px 20px 20px 20px; color: #fff;
  }
  .user .bubble { 
    background: var(--gold); color: var(--navy); font-weight: 500;
    border-radius: 20px 4px 20px 20px;
  }

  /* === OPSI JAWABAN === */
  .options {
    display: flex; flex-direction: column; gap: 10px; margin-top: 16px;
  }
  .options button {
    background: transparent; border: 1px solid rgba(212,175,55,0.4); color: var(--gold);
    padding: 14px 20px; border-radius: 8px; cursor: pointer; font-family: inherit;
    font-size: 0.95rem; text-align: left; transition: all 0.2s var(--ease);
    display: flex; justify-content: space-between; align-items: center;
  }
  .options button:hover {
    background: rgba(212,175,55,0.1); border-color: var(--gold); transform: translateX(4px);
  }
  .options button::after { content: "→"; opacity: 0; transition: opacity 0.2s; }
  .options button:hover::after { opacity: 1; }

  /* === TYPING INDICATOR === */
  .typing {
    display: flex; gap: 4px; padding: 8px 12px; background: var(--navy-light);
    border-radius: 12px; width: fit-content; border: 1px solid var(--border);
  }
  .typing span {
    width: 6px; height: 6px; background: var(--gold); border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  /* === HASIL AKHIR (CTA) === */
  .result-card {
    background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(14,26,43,0.8));
    border: 1px solid var(--gold); padding: 24px; border-radius: 16px; margin-top: 16px;
    text-align: center; animation: slideUp 0.5s var(--ease) forwards;
  }
  .result-card h3 { font-family: var(--font-serif); color: var(--gold); font-size: 1.4rem; margin-bottom: 8px; }
  .result-card p { font-size: 0.95rem; color: var(--text-main); margin-bottom: 20px; }
  .btn-wa {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px; background: #25D366; color: #000;
    font-weight: 700; border-radius: 8px; text-decoration: none; transition: 0.3s;
  }
  .btn-wa:hover { background: #1EBE5D; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37,211,102,0.2); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <img src="assets/logo.jpeg" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
  <svg width="44" height="44" viewBox="0 0 100 100" fill="none" style="display:none; border-radius:8px;">
    <rect width="100" height="100" rx="20" fill="#D4AF37"/>
    <text x="50" y="68" font-family="Arial" font-weight="900" font-size="46" fill="#050B14" text-anchor="middle">AP</text>
  </svg>
  <div class="header-info">
    <h1>Kuis Karier Arima</h1>
    <p>Online - Siap membantu</p>
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- CHAT AREA -->
<div class="chat-container" id="chatContainer">
  <!-- Pesan akan dimuat via JS -->
</div>

<script>
  const chat = document.getElementById('chatContainer');
  const progressBar = document.getElementById('progressBar');
  
  // State Kuis
  let step = 0;
  const totalSteps = 3;
  let userData = { pendidikan: '', minat: '' };

  // Fungsi Menambah Pesan
  function addMessage(text, sender, isHTML = false) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    
    if (sender === 'bot') {
      msgDiv.innerHTML = `
        <div class="bot-avatar">A</div>
        <div class="bubble">${isHTML ? text : `<p>${text}</p>`}</div>
      `;
    } else {
      msgDiv.innerHTML = `<div class="bubble">${text}</div>`;
    }
    
    chat.appendChild(msgDiv);
    chat.scrollTop = chat.scrollHeight;
  }

  // Fungsi Animasi Mengetik
  function showTyping(callback) {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot typing-indicator-wrapper';
    typingDiv.innerHTML = `
      <div class="bot-avatar">A</div>
      <div class="typing"><span></span><span></span><span></span></div>
    `;
    chat.appendChild(typingDiv);
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => {
      typingDiv.remove();
      callback();
    }, 1200); // Delay 1.2 detik
  }

  // Update Progress Bar
  function updateProgress() {
    const percent = (step / totalSteps) * 100;
    progressBar.style.width = `${percent}%`;
  }

  // --- ALUR KUIS ---

  // Langkah 1: Sambutan & Pendidikan
  function step1() {
    step = 1;
    updateProgress();
    showTyping(() => {
      addMessage("Halo! Selamat datang di Kuis Karier <b>LPKS Arima Persada</b>. 👋", "bot", true);
      setTimeout(() => {
        showTyping(() => {
          addMessage("Saya akan membantumu menemukan jalur karier yang paling cocok. Boleh tahu, saat ini kamu berada di tahap mana?", "bot", true);
          
          const optionsHTML = `
            <div class="options">
              <button onclick="pilihPendidikan('Lulusan SMA/SMK')">Lulusan SMA/SMK</button>
              <button onclick="pilihPendidikan('Lulusan D3/S1')">Lulusan D3/S1</button>
              <button onclick="pilihPendidikan('Sudah Bekerja')">Sudah Bekerja</button>
            </div>
          `;
          addMessage(optionsHTML, "bot", true);
        });
      }, 800);
    });
  }

  // Langkah 2: Minat
  function pilihPendidikan(jawaban) {
    userData.pendidikan = jawaban;
    addMessage(jawaban, "user");
    
    // Hapus tombol opsi sebelumnya
    document.querySelectorAll('.options').forEach(el => el.remove());
    
    step = 2;
    updateProgress();

    setTimeout(() => {
      showTyping(() => {
        addMessage(`Menarik! Untuk lulusan <b>${jawaban}</b>, peluangnya sangat luas.`, "bot", true);
        setTimeout(() => {
          showTyping(() => {
            addMessage("Sektor pekerjaan apa yang paling kamu minati di Jepang?", "bot", true);
            
            const optionsHTML = `
              <div class="options">
                <button onclick="pilihMinat('Perawatan (Kaigo)')">Perawatan (Kaigo)</button>
                <button onclick="pilihMinat('Manufaktur / Pabrik')">Manufaktur / Pabrik</button>
                <button onclick="pilihMinat('Makanan & Hospitality')">Makanan & Hospitality</button>
              </div>
            `;
            addMessage(optionsHTML, "bot", true);
          });
        }, 600);
      });
    }, 600);
  }

  // Langkah 3: Hasil Akhir
  function pilihMinat(jawaban) {
    userData.minat = jawaban;
    addMessage(jawaban, "user");
    
    document.querySelectorAll('.options').forEach(el => el.remove());
    
    step = 3;
    updateProgress();

    setTimeout(() => {
      showTyping(() => {
        // Generate Pesan Hasil
        const resultHTML = `
          <p>Berdasarkan jawabanmu, kamu sangat cocok untuk jalur:</p>
          <div class="result-card">
            <h3>${userData.minat}</h3>
            <p>Jalur <b>Tokutei Ginou (SSW)</b> atau <b>Magang</b> di sektor ini memiliki permintaan tinggi dari perusahaan Jepang.</p>
            <a href="https://wa.me/6282375128230?text=Halo%20Admin,%20saya%20sudah%20menyelesaikan%20Kuis%20Karier.%20Pendidikan:%20${encodeURIComponent(userData.pendidikan)},%20Minat:%20${encodeURIComponent(userData.minat)}.%20Mohon%20info%20lebih%20lanjut." class="btn-wa" target="_blank">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
              Konsultasi Hasil via WhatsApp
            </a>
          </div>
        `;
        addMessage(resultHTML, "bot", true);
        progressBar.style.width = '100%';
      });
    }, 600);
  }

  // Mulai Kuis saat halaman dimuat
  window.onload = () => {
    setTimeout(step1, 500);
  };
</script>

</body>
</html>
