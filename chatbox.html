<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Konsultasi Karier Jepang — LPKS Arima Persada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --bot-bubble: #2a2a2a;
            --user-bubble: #d4af37;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #d4af37;
            --accent-hover: #b5952f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #333;
        }

        .chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #fff;
        }

        .chat-header-info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .chat-header-info p {
            font-size: 12px;
            color: #4caf50;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-track { background: transparent; }
        .chat-body::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-bot {
            background-color: var(--bot-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            background-color: var(--user-bubble);
            color: #121212;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            animation: fadeIn 0.3s ease;
        }

        .option-btn {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 15px;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: var(--accent-color);
            color: #121212;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            animation: fadeIn 0.3s ease;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .input-group button {
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .result-card {
            background-color: #2a2a2a;
            border: 1px solid var(--accent-color);
            border-radius: 15px;
            padding: 15px;
            margin-top: 10px;
            animation: fadeIn 0.5s ease;
        }
        .result-card h4 {
            color: var(--accent-color);
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .result-card ul {
            list-style: none;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 15px;
        }
        .result-card ul li span {
            color: var(--text-muted);
            display: inline-block;
            width: 120px;
        }

        .urgency-text {
            color: #ff9800;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 10px;
            display: block;
        }

        .social-proof {
            font-size: 11px;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 15px;
        }

        .cta-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <img src="assets/logo.jpeg" alt="Arima Logo" onerror="this.src='https://via.placeholder.com/40/d4af37/000000?text=A'">
            <div class="chat-header-info">
                <h3>Arima-bot</h3>
                <p>Online</p>
            </div>
        </div>

        <div class="chat-body" id="chatBody"></div>
    </div>

    <script>
        // GANTI NOMOR WA ADMIN DI SINI
        const WA_NUMBER = "6281234567890"; 

        const chatBody = document.getElementById('chatBody');
        let step = 0;
        let userData = { status: '', bidang: '', metode: '', jam: '', nama: '', wa: '' };

        // --- FUNGSI UTAMA CHAT ---
        function addMessage(text, sender, isHTML = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'bot' ? 'msg-bot' : 'msg-user'}`;
            if (isHTML) msgDiv.innerHTML = text;
            else msgDiv.innerText = text;
            chatBody.appendChild(msgDiv);
            scrollToBottom();
        }

        function showTyping(callback) {
            const typingDiv = document.createElement('div');
            typingDiv.className = `message msg-bot typing-container`;
            typingDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
            chatBody.appendChild(typingDiv);
            scrollToBottom();

            setTimeout(() => {
                chatBody.removeChild(typingDiv);
                callback();
            }, 1000);
        }

        function scrollToBottom() {
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function renderOptions(options) {
            const container = document.createElement('div');
            container.className = 'options-container';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.label;
                btn.onclick = () => handleOptionClick(opt.value, opt.label, container);
                container.appendChild(btn);
            });
            chatBody.appendChild(container);
            scrollToBottom();
        }

        function renderInput(placeholder, type, btnText, onSave) {
            const group = document.createElement('div');
            group.className = 'input-group';
            
            const input = document.createElement('input');
            input.type = type;
            input.placeholder = placeholder;
            
            const btn = document.createElement('button');
            btn.innerText = btnText;
            
            const submitAction = () => {
                const val = input.value.trim();
                if(val === '') return;
                onSave(val);
                group.remove();
            };

            btn.onclick = submitAction;
            input.onkeypress = (e) => { if(e.key === 'Enter') submitAction(); };

            group.appendChild(input);
            group.appendChild(btn);
            chatBody.appendChild(group);
            scrollToBottom();
            input.focus();
        }

        // --- LOGIKA PERCAKAPAN ---

        function initChat() {
            showTyping(() => {
                addMessage("Halo! Selamat datang di LPKS Arima Persada 👋. Saya Arima-bot. Biar saya bisa bantu carikan program yang paling pas buat karier kamu di Jepang, boleh ikuti sesi konsultasi singkat ini?", 'bot');
                setTimeout(askQ1, 600);
            });
        }

        function askQ1() {
            showTyping(() => {
                addMessage("Boleh tahu, saat ini pendidikan terakhir atau status kamu apa?", 'bot');
                renderOptions([
                    { label: "🎓 Pelajar / Mahasiswa", value: "Pelajar / Mahasiswa" },
                    { label: "🏫 Lulusan SMA / SMK", value: "Lulusan SMA / SMK" },
                    { label: "💼 Sudah Bekerja (Karyawan)", value: "Sudah Bekerja (Karyawan)" },
                    { label: "🎓 Lulusan D3 / S1", value: "Lulusan D3 / S1" }
                ]);
            });
        }

        function askQ2() {
            showTyping(() => {
                addMessage("Menarik! Lalu, bidang pekerjaan apa yang paling kamu minati di Jepang nanti?", 'bot');
                renderOptions([
                    { label: "🧑‍🦳 Perawatan Lansia (Kaigo)", value: "Perawatan Lansia" },
                    { label: "🏭 Manufaktur / Pabrik", value: "Manufaktur" },
                    { label: "🍽️ Makanan & Minuman (Food Service)", value: "Food Service" },
                    { label: "🏨 Perhotelan (Hospitality)", value: "Hospitality" },
                    { label: "🚜 Pertanian & Perkebunan", value: "Pertanian" },
                    { label: "🏗️ Konstruksi (Kensetsu)", value: "Konstruksi" },
                    { label: "🚗 Otomotif", value: "Otomotif" },
                    { label: "👨‍💻 IT / Teknik (Engineering)", value: "IT / Teknik" }
                ]);
            });
        }

        function askQ3() {
            showTyping(() => {
                addMessage("Kalau untuk belajarnya sendiri, kamu lebih nyaman tatap muka langsung (offline) atau fleksibel dari rumah (online)?", 'bot');
                renderOptions([
                    { label: "🏫 Offline (Tatap muka di kelas)", value: "Offline" },
                    { label: "💻 Online (Belajar jarak jauh)", value: "Online" }
                ]);
            });
        }

        // LOGIKA DINAMIS UNTUK PERTANYAAN 4
        function askQ4() {
            showTyping(() => {
                addMessage("Baik. Kira-kira jadwal mana yang paling pas buat kamu?", 'bot');
                
                let options = [];

                if (userData.metode === "Online") {
                    // Jika Online, hanya ada pilihan malam (sesuai tabel)
                    options = [
                        { label: "Senin, Rabu, Jumat (Mulai 20.00)", value: "Senin, Rabu, Jumat (Mulai 20.00)" },
                        { label: "Selasa, Kamis, Sabtu (Mulai 20.00)", value: "Selasa, Kamis, Sabtu (Mulai 20.00)" }
                    ];
                } else {
                    // Jika Offline, sortir berdasarkan status (Pelajar vs Pekerja)
                    if (userData.status === "Pelajar / Mahasiswa") {
                        options = [
                            { label: "Senin, Rabu, Jumat (Mulai 20.00)", value: "Senin, Rabu, Jumat (Mulai 20.00)" },
                            { label: "Selasa, Kamis, Sabtu (Mulai 20.00)", value: "Selasa, Kamis, Sabtu (Mulai 20.00)" }
                        ];
                    } else if (userData.status === "Sudah Bekerja (Karyawan)") {
                        options = [
                            { label: "Sabtu & Minggu (08.00 - 15.00)", value: "Sabtu & Minggu (08.00 - 15.00)" },
                            { label: "Senin, Rabu, Jumat (Mulai 20.00)", value: "Senin, Rabu, Jumat (Mulai 20.00)" },
                            { label: "Selasa, Kamis, Sabtu (Mulai 20.00)", value: "Selasa, Kamis, Sabtu (Mulai 20.00)" }
                        ];
                    } else {
                        // Umum / D3/S1 (Bisa pagi, atau malam)
                        options = [
                            { label: "Senin - Jumat (08.00 - 15.00)", value: "Senin - Jumat (08.00 - 15.00)" },
                            { label: "Senin, Rabu, Jumat (Mulai 20.00)", value: "Senin, Rabu, Jumat (Mulai 20.00)" },
                            { label: "Selasa, Kamis, Sabtu (Mulai 20.00)", value: "Selasa, Kamis, Sabtu (Mulai 20.00)" }
                        ];
                    }
                }
                renderOptions(options);
            });
        }

        function handleOptionClick(value, label, container) {
            container.remove();
            addMessage(label, 'user');
            
            if (step === 0) { userData.status = value; step++; setTimeout(askQ2, 600); }
            else if (step === 1) { userData.bidang = value; step++; setTimeout(askQ3, 600); }
            else if (step === 2) { userData.metode = value; step++; setTimeout(askQ4, 600); }
            else if (step === 3) { userData.jam = value; step++; setTimeout(askName, 600); }
        }

        function askName() {
            showTyping(() => {
                addMessage("Sebentar, rekomendasi programmu sedang disiapkan... 🤔", 'bot');
                setTimeout(() => {
                    showTyping(() => {
                        addMessage("Biar hasilnya bisa langsung disimpan dan dikirim ke WhatsApp, boleh tahu nama panggilanmu?", 'bot');
                        renderInput("Ketik nama kamu...", "text", "Lanjut", (val) => {
                            userData.nama = val;
                            addMessage(val, 'user');
                            askWA();
                        });
                    });
                }, 800);
            });
        }

        function askWA() {
            showTyping(() => {
                addMessage(`Halo ${userData.nama}! Ketik nomor WhatsApp yang aktif ya (contoh: 08123456789).`, 'bot');
                renderInput("Nomor WhatsApp...", "tel", "Simpan", (val) => {
                    userData.wa = val;
                    addMessage(val, 'user');
                    showResult();
                });
            });
        }

        // --- LOGIKA FINAL (PEMETAAN KE TABEL) ---
        function getRecommendation() {
            let program = "";
            let details = {};

            if (userData.metode === "Online") {
                if (userData.status === "Pelajar / Mahasiswa") {
                    program = "PROGRAM MAGANG - BASIC (ONLINE)";
                    details = { pertemuan: "30 Kali", bab: "25 BAB", durasi: "2.5 Bulan", jadwal: userData.jam + " | @90 menit" };
                } else {
                    program = "PROGRAM MAGANG - REGULER (ONLINE)";
                    details = { pertemuan: "45 Kali", bab: "35 BAB", durasi: "3.75 Bulan", jadwal: userData.jam + " | @90 menit" };
                }
            } else { // Offline
                if (userData.jam.includes("Sabtu & Minggu")) {
                    program = "PROGRAM TOKUTEI GINOU - CORPORATE (OFFLINE)";
                    details = { peserta: "Karyawan / Pekerja", pertemuan: "30 Kali", bab: "50 BAB", durasi: "3.75 Bulan", jadwal: userData.jam };
                } else if (userData.jam.includes("Senin - Jumat")) {
                    if (userData.bidang === "IT / Teknik" && userData.status === "Lulusan D3 / S1") {
                        program = "PROGRAM ENGINEER (OFFLINE + ONLINE)";
                        details = { target: "Lulus N3", materi: "50 + Materi N3", durasi: "6 - 8 Bulan", jadwal: userData.jam };
                    } else {
                        program = "PROGRAM MAGANG - REGULER (OFFLINE)";
                        details = { target: "Lulus A1", pertemuan: "35 Kali", bab: "50 BAB", jadwal: userData.jam };
                    }
                } else { // Jadwal Malam
                    if (userData.status === "Pelajar / Mahasiswa") {
                        program = "PROGRAM MAGANG - BASIC (OFFLINE)";
                        details = { pertemuan: "30 Kali", bab: "25 BAB", durasi: "2.5 Bulan", jadwal: userData.jam + " | @120 menit" };
                    } else {
                        program = "PROGRAM TOKUTEI GINOU - REGULER (MALAM)";
                        details = { pertemuan: "60 Kali", bab: "50 BAB", durasi: "5 Bulan", jadwal: userData.jam + " | @90 menit" };
                    }
                }
            }

            return { program, details };
        }

        function showResult() {
            showTyping(() => {
                const result = getRecommendation();
                const { program, details } = result;

                let detailHTML = "";
                for (const [key, value] of Object.entries(details)) {
                    detailHTML += `<li><span>${key.charAt(0).toUpperCase() + key.slice(1)}</span>: ${value}</li>`;
                }

                const textPesan = `Halo Admin LPKS Arima, saya *${userData.nama}*. Saya baru selesai ikut kuis di web. Saya tertarik dengan *${program}* untuk bidang *${userData.bidang}*. Mohon info biaya dan pendaftarannya. Saya ingin klaim voucher pendaftaran.`;
                const waLink = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(textPesan)}`;

                const resultHTML = `
                    <div class="result-card">
                        <h4>🎯 Rekomendasi Program Kamu</h4>
                        <p style="font-weight: 600; font-size: 15px; margin-bottom: 10px; color: #fff;">${program}</p>
                        <ul>
                            ${detailHTML}
                        </ul>
                        
                        <span class="urgency-text">⚠️ Kuota untuk batch pendaftaran bulan ini tersisa 5 kursi.</span>
                        
                        <div class="social-proof">
                            "Kamu satu langkah lebih dekat dengan Jepang! Bergabunglah dengan 500+ alumni Arima Persada yang sudah sukses bekerja di sana."
                        </div>

                        <a href="${waLink}" target="_blank" class="cta-btn">
                            🎁 Klaim Voucher & Kunci Kursi Saya
                        </a>
                    </div>
                `;
                
                addMessage(resultHTML, 'bot', true);
            });
        }

        window.onload = initChat;
    </script>
</body>
</html>
