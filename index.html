<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsultasi Karier Jepang - LPKS Arima Persada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #E5E7EB; }
        /* Custom Scrollbar untuk Chat */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        
        /* Animasi Chat Bubble */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .chat-bubble { animation: popIn 0.3s ease-out forwards; }
        
        /* Typing Indicator */
        .typing-dots {
            display: inline-flex; gap: 4px; padding: 12px 18px;
        }
        .typing-dots span {
            width: 6px; height: 6px; background-color: #94A3B8; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen m-0 p-0 md:p-4">

    <!-- CONTAINER CHAT -->
    <div class="w-full max-w-md h-full md:h-[85vh] bg-gray-50 md:rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-gray-200 relative">
        
        <!-- HEADER CHAT -->
        <div class="bg-[#0A3155] text-white p-4 flex items-center gap-4 shrink-0 shadow-md z-10">
            <div class="relative">
                <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center overflow-hidden border-2 border-white/20">
                    <!-- Fallback Logo -->
                    <img src="Logo polos.jpeg" alt="Logo" class="w-full h-full object-cover absolute inset-0 z-10" onerror="this.style.display='none';">
                    <span class="text-[#0A3155] font-bold text-xl relative z-0">A</span>
                </div>
                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-[#0A3155] rounded-full"></div>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Admin LPKS Arima</h1>
                <p class="text-xs text-blue-200">Online - Membalas cepat</p>
            </div>
        </div>

        <!-- AREA CHAT (SCROLLABLE) -->
        <div id="chatArea" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4 bg-[#EFEAE2] relative">
            <!-- Background Pattern (Opsional) -->
            <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');"></div>
            
            <!-- Chat akan diisi oleh Javascript -->
        </div>

        <!-- AREA INPUT (OPSIONAL, KITA GUNAKAN TOMBOL PILIHAN) -->
        <div id="inputArea" class="p-3 bg-gray-100 border-t border-gray-200 shrink-0 hidden">
            <div class="flex items-center gap-2">
                <input type="text" id="userInput" placeholder="Ketik pesan..." class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-3 text-sm focus:outline-none focus:border-[#0A3155] focus:ring-1 focus:ring-[#0A3155]">
                <button onclick="handleSendMessage()" class="w-12 h-12 bg-[#0A3155] text-white rounded-full flex items-center justify-center hover:bg-blue-900 transition shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const chatArea = document.getElementById('chatArea');
        const inputArea = document.getElementById('inputArea');
        const userInput = document.getElementById('userInput');
        
        // Data pengguna
        let userData = {
            nama: '',
            whatsapp: '',
            pendidikan: '',
            bahasa: '',
            program: ''
        };

        // Fungsi untuk scroll ke bawah
        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Fungsi menampilkan pesan Bot
        function botReply(message, options = null, delay = 1000, isInput = false) {
            // Tampilkan indikator mengetik
            const typingId = 'typing-' + Date.now();
            const typingHTML = `
                <div id="${typingId}" class="flex items-start gap-2 chat-bubble">
                    <div class="w-8 h-8 bg-[#0A3155] rounded-full flex items-center justify-center shrink-0 text-white text-xs"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-white rounded-2xl rounded-tl-none shadow-sm typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatArea.insertAdjacentHTML('beforeend', typingHTML);
            scrollToBottom();

            setTimeout(() => {
                // Hapus indikator mengetik
                document.getElementById(typingId).remove();

                // Tampilkan pesan bot
                let optionsHTML = '';
                if (options) {
                    optionsHTML = `<div class="flex flex-wrap gap-2 mt-3">`;
                    options.forEach(opt => {
                        optionsHTML += `<button onclick="handleOption('${opt.value}', '${opt.label}')" class="bg-white border-2 border-[#0A3155] text-[#0A3155] font-semibold text-sm px-4 py-2 rounded-full hover:bg-[#0A3155] hover:text-white transition-all shadow-sm">${opt.label}</button>`;
                    });
                    optionsHTML += `</div>`;
                }

                const messageHTML = `
                    <div class="flex items-start gap-2 chat-bubble">
                        <div class="w-8 h-8 bg-[#0A3155] rounded-full flex items-center justify-center shrink-0 text-white text-xs"><i class="fa-solid fa-robot"></i></div>
                        <div class="max-w-[80%]">
                            <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm text-sm text-gray-800 leading-relaxed">
                                ${message}
                            </div>
                            ${optionsHTML}
                        </div>
                    </div>
                `;
                chatArea.insertAdjacentHTML('beforeend', messageHTML);
                scrollToBottom();

                // Jika butuh input teks
                if (isInput) {
                    inputArea.classList.remove('hidden');
                    userInput.focus();
                } else {
                    inputArea.classList.add('hidden');
                }

            }, delay);
        }

        // Fungsi menampilkan pesan User
        function userReply(message) {
            const messageHTML = `
                <div class="flex items-start justify-end gap-2 chat-bubble">
                    <div class="bg-[#D90429] text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm text-sm max-w-[80%] leading-relaxed">
                        ${message}
                    </div>
                </div>
            `;
            chatArea.insertAdjacentHTML('beforeend', messageHTML);
            scrollToBottom();
            inputArea.classList.add('hidden'); // Sembunyikan input saat memilih opsi
        }

        // Handler saat tombol opsi diklik
        function handleOption(value, label) {
            userReply(label);
            
            if (value === 'sma' || value === 'd3s1') {
                userData.pendidikan = label;
                askBahasa();
            } else if (value === 'pemula' || value === 'n5n4' || value === 'n3n2') {
                userData.bahasa = label;
                askNama();
            } else if (value === 'mulai') {
                askPendidikan();
            }
        }

        // Handler saat user mengetik dan mengirim pesan
        function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userReply(text);
            userInput.value = '';

            if (!userData.nama) {
                userData.nama = text;
                askWhatsApp();
            } else if (!userData.whatsapp) {
                userData.whatsapp = text;
                showResult();
            }
        }

        // Deteksi tombol Enter
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleSendMessage();
        });

        /* ==========================================
           ALUR PERCAKAPAN (FLOW)
           ========================================== */

        // Mulai Chat
        window.onload = () => {
            setTimeout(() => {
                botReply(
                    "Halo! 👋 Selamat datang di <b>LPKS Arima Persada</b>.<br><br>Saya Admin Bot. Sedang cari info program kerja ke Jepang ya?",
                    [{ label: "Ya, saya mau tanya-tanya", value: "mulai" }]
                );
            }, 500);
        };

        function askPendidikan() {
            botReply(
                "Baik, senang bisa membantu! 😊<br><br>Sebelumnya, boleh tahu <b>pendidikan terakhir</b> Anda?",
                [
                    { label: "SMA / SMK", value: "sma" },
                    { label: "D3 / S1", value: "d3s1" }
                ]
            );
        }

        function askBahasa() {
            botReply(
                "Oke, sip! Kalau untuk <b>kemampuan Bahasa Jepang</b>, saat ini sudah sampai level mana nih?",
                [
                    { label: "Belum bisa sama sekali", value: "pemula" },
                    { label: "Sudah dasar (N5/N4)", value: "n5n4" },
                    { label: "Lancar (N3/N2)", value: "n3n2" }
                ]
            );
        }

        function askNama() {
            botReply(
                "Wah, bagus sekali! Berdasarkan kriteria Anda, peluangnya sangat terbuka lebar. 🎌<br><br>Boleh tahu <b>nama lengkap</b> Anda?",
                null,
                1000,
                true // Aktifkan input teks
            );
        }

        function askWhatsApp() {
            botReply(
                `Halo <b>${userData.nama}</b>! Senang berkenalan dengan Anda. 🙏<br><br>Terakhir, boleh minta <b>nomor WhatsApp</b> yang aktif? Agar tim konsultan kami bisa langsung menghubungi Anda.`,
                null,
                1000,
                true
            );
        }

        function showResult() {
            // Tentukan rekomendasi berdasarkan logika sederhana
            if (userData.pendidikan === 'D3 / S1' || userData.bahasa.includes('N3/N2')) {
                userData.program = "Gijinkoku (Engineer)";
            } else if (userData.bahasa.includes('N5/N4')) {
                userData.program = "Tokutei Ginou (SSW)";
            } else {
                userData.program = "Magang Jepang (Ikusei Shuro)";
            }

            botReply(
                `Terima kasih banyak, <b>${userData.nama}</b>! Data Anda sudah kami terima. ✅<br><br>Berdasarkan jawaban Anda, program <b>${userData.program}</b> sepertinya paling cocok. Tim kami akan segera menghubungi nomor <b>${userData.whatsapp}</b>.<br><br>Atau Anda bisa langsung klik tombol di bawah ini untuk terhubung ke WhatsApp Admin kami:`,
                null,
                1500
            );

            // Buat pesan otomatis untuk WA
            const waText = `Halo Admin LPKS Arima Persada,%0A%0ASaya *${userData.nama}* baru saja mengisi form di website.%0A%0A*Data Saya:*%0A- Pendidikan: ${userData.pendidikan}%0A- Bahasa Jepang: ${userData.bahasa}%0A- Rekomendasi: ${userData.program}%0A%0ASaya ingin konsultasi lebih lanjut mengenai program ini. Terima kasih!`;
            const waLink = `https://wa.me/6282375128230?text=${waText}`;

            // Tambahkan tombol WA setelah pesan bot
            setTimeout(() => {
                const waButtonHTML = `
                    <div class="flex items-start gap-2 chat-bubble mt-2">
                        <div class="w-8 h-8 bg-transparent shrink-0"></div>
                        <div class="max-w-[80%]">
                            <a href="${waLink}" target="_blank" class="inline-flex items-center gap-2 bg-[#25D366] hover:bg-green-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition-transform hover:-translate-y-0.5">
                                <i class="fa-brands fa-whatsapp text-xl"></i> Lanjut ke WhatsApp Admin
                            </a>
                        </div>
                    </div>
                `;
                chatArea.insertAdjacentHTML('beforeend', waButtonHTML);
                scrollToBottom();
            }, 2000);
        }
    </script>
</body>
</html>
